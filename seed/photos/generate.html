<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>仿真证件照生成器</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 16px; background: #f4f6f1; color: #15231b; }
      #log { white-space: pre-wrap; font-family: monospace; }
      .grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
      .grid figure { margin: 0; width: 220px; }
      .grid img { width: 220px; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <h1>仿真证件照生成器</h1>
    <p>全部是自制样本，每张带「SIMULATED / CONTOH」水印；由 <code>seed/photos/render.mjs</code> 提供数据并保存结果。</p>
    <div id="log">准备中…</div>
    <div class="grid" id="grid"></div>
    <script>
      // ---------- 小工具 ----------
      const W = 1240; // 纸面 A4 @150dpi
      const H = 1754;
      const SERIF = '"Times New Roman", Georgia, serif';
      const MONO = '"Courier New", monospace';
      const HAND = '"Ink Free", "Segoe Script", "Bradley Hand", cursive';
      const INK = '#1c1c22';

      /** 可复现的随机数（同一个 seed 画出同一张） */
      function rng(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });

      function text(ctx, s, x, y, o = {}) {
        const { size = 28, font = SERIF, weight = 'normal', color = INK, align = 'left', track = 0 } = o;
        ctx.font = `${weight} ${size}px ${font}`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = 'alphabetic';
        ctx.letterSpacing = `${track}px`;
        ctx.fillText(s, x, y);
        ctx.letterSpacing = '0px';
      }
      function line(ctx, x1, y1, x2, y2, w = 2, color = INK, dash = []) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }
      function box(ctx, x, y, w, h, lw = 2, color = INK) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.strokeRect(x, y, w, h);
        ctx.restore();
      }
      /** 自动换行 */
      function wrap(ctx, s, x, y, maxW, lh, o) {
        ctx.font = `${o.weight ?? 'normal'} ${o.size ?? 28}px ${o.font ?? SERIF}`;
        let row = '';
        let yy = y;
        for (const word of s.split(' ')) {
          const test = row ? `${row} ${word}` : word;
          if (ctx.measureText(test).width > maxW && row) {
            text(ctx, row, x, yy, o);
            row = word;
            yy += lh;
          } else row = test;
        }
        text(ctx, row, x, yy, o);
        return yy;
      }
      /** 一行字段：左边标签（印刷体），右边填的值（打字机体），下面一条点线 */
      function field(ctx, label, value, x, y, w, o = {}) {
        text(ctx, label, x, y, { size: o.labelSize ?? 26, color: '#333' });
        text(ctx, value, x + (o.labelW ?? 330), y, { size: o.size ?? 32, font: MONO, weight: 'bold' });
        line(ctx, x + (o.labelW ?? 330), y + 10, x + w, y + 10, 1.5, '#555', [2, 5]);
      }

      function paper(ctx, r) {
        ctx.fillStyle = '#f6f2e7';
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < 2200; i++) {
          ctx.fillStyle = `rgba(120,100,60,${r() * 0.028})`;
          ctx.beginPath();
          ctx.arc(r() * W, r() * H, r() * 70 + 10, 0, 7);
          ctx.fill();
        }
        // 折痕
        line(ctx, 0, H / 2, W, H / 2, 2, 'rgba(0,0,0,0.05)');
        line(ctx, W / 2, 0, W / 2, H, 2, 'rgba(0,0,0,0.035)');
      }
      /** 对角水印：每张都有，不能被当成真证件 */
      function watermark(ctx) {
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.rotate(-Math.PI / 5);
        ctx.textAlign = 'center';
        ctx.font = `bold 92px ${SERIF}`;
        ctx.fillStyle = 'rgba(180,30,30,0.11)';
        for (let i = -6; i <= 6; i++) ctx.fillText('SIMULATED / CONTOH', 0, i * 250);
        ctx.restore();
        text(ctx, 'Dokumen simulasi untuk ujian — bukan dokumen sebenar / Simulated sample, not a real document', W / 2, H - 78, {
          size: 20,
          color: 'rgba(150,30,30,0.85)',
          align: 'center',
        });
      }
      /** 圆形「CONTOH」章（不仿真任何官方印章） */
      function stamp(ctx, cx, cy, r, lines, color = 'rgba(40,70,150,0.55)', rot = -0.2) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, 7);
        ctx.stroke();
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, r - 14, 0, 7);
        ctx.stroke();
        lines.forEach((s, i) => text(ctx, s, 0, (i - (lines.length - 1) / 2) * 34 + 10, { size: 28, weight: 'bold', color, align: 'center', track: 2 }));
        ctx.restore();
      }
      function hand(ctx, s, x, y, size, rot = -0.03, color = '#1b3a8a') {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        text(ctx, s, 0, 0, { size, font: HAND, color });
        ctx.restore();
      }
      /** 示意的地块边界图（不是真实测绘） */
      function planSketch(ctx, x, y, w, h, r) {
        box(ctx, x, y, w, h, 2, '#555');
        text(ctx, 'Pelan (contoh) — tidak mengikut skala', x + 12, y + 28, { size: 20, color: '#555' });
        const cx = x + w / 2;
        const cy = y + h / 2 + 12;
        ctx.save();
        ctx.strokeStyle = INK;
        ctx.lineWidth = 3;
        ctx.beginPath();
        const pts = [
          [-w * 0.3, -h * 0.22], [w * 0.28, -h * 0.28], [w * 0.33, h * 0.2], [-w * 0.05, h * 0.3], [-w * 0.32, h * 0.12],
        ].map(([a, b]) => [cx + a + (r() - 0.5) * 14, cy + b + (r() - 0.5) * 14]);
        pts.forEach(([a, b], i) => (i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)));
        ctx.closePath();
        ctx.stroke();
        ctx.fillStyle = 'rgba(60,110,70,0.10)';
        ctx.fill();
        ctx.restore();
        pts.forEach(([a, b], i) => text(ctx, String(i + 1), a + 8, b - 8, { size: 22, color: '#444' }));
        text(ctx, 'U ↑', x + w - 70, y + 30, { size: 24, weight: 'bold', color: '#444' });
      }

      // ---------- 四种证件 ----------
      function drawTitle1(ctx, d, r) {
        paper(ctx, r);
        box(ctx, 50, 50, W - 100, H - 100, 4);
        box(ctx, 62, 62, W - 124, H - 124, 1.5);
        text(ctx, 'NEGERI PERAK DARUL RIDZUAN', W / 2, 150, { size: 38, weight: 'bold', align: 'center', track: 3 });
        text(ctx, 'KANUN TANAH NEGARA 1965', W / 2, 196, { size: 26, align: 'center', color: '#444' });
        text(ctx, 'GERAN', W / 2, 300, { size: 118, weight: 'bold', align: 'center', track: 14 });
        text(ctx, '(bentuk contoh untuk ujian — bukan hakmilik sebenar)', W / 2, 346, { size: 22, align: 'center', color: '#a33' });
        // 右上角的号码框
        box(ctx, W - 470, 380, 380, 112, 2.5);
        text(ctx, 'No. Hakmilik', W - 455, 414, { size: 22, color: '#444' });
        text(ctx, d.titleNo, W - 455, 466, { size: 40, font: MONO, weight: 'bold' });
        text(ctx, 'Hakmilik', 100, 430, { size: 24, color: '#444' });
        text(ctx, 'Hakmilik Sementara / Pendaftaran', 100, 462, { size: 24, color: '#444' });
        const RH = 64; // 行距
        let y = 580;
        const rows = [
          ['No. Lot', d.lotNo],
          ['Mukim', d.mukim],
          ['Daerah', d.district],
          ['Negeri', d.state],
          ['Luas Lot', d.area],
        ];
        for (const [k, v] of rows) {
          field(ctx, k, v, 100, y, W - 200);
          y += RH;
        }
        if (d.handwrittenArea) {
          // 手写的面积备注，写在「Luas Lot」那一行的右边、点线下面
          hand(ctx, d.handwrittenArea, 640, y - RH + 50, 40, -0.04);
          line(ctx, 636, y - RH + 58, 1100, y - RH + 54, 2, '#1b3a8a');
        }
        field(ctx, 'Kegunaan Tanah', d.landUse, 100, y, W - 200);
        y += RH;
        field(ctx, 'Kategori Pegangan', d.tenure, 100, y, W - 200);
        y += 84;
        text(ctx, 'Syarat Nyata:', 100, y, { size: 26, weight: 'bold' });
        const yy = wrap(ctx, d.condition, 100, y + 42, W - 260, 38, { size: 27, font: MONO });
        text(ctx, 'Sekatan Kepentingan:', 100, yy + 62, { size: 26, weight: 'bold' });
        text(ctx, 'Tiada.', 420, yy + 62, { size: 28, font: MONO });
        const py = yy + 100;
        planSketch(ctx, 100, py, 600, 330, r);
        // 示意图右边：签名线与章
        line(ctx, 800, py + 290, 1130, py + 290, 2);
        text(ctx, 'Pendaftar Hakmilik (contoh)', 800, py + 326, { size: 22, color: '#444' });
        stamp(ctx, 930, py + 150, 96, ['CONTOH', 'SIMULASI']);
        watermark(ctx);
      }

      function drawTitle2(ctx, d, r) {
        paper(ctx, r);
        box(ctx, 50, 50, W - 100, H - 100, 4);
        text(ctx, 'REKOD PEMUNYAAN', W / 2, 150, { size: 54, weight: 'bold', align: 'center', track: 4 });
        text(ctx, 'Record of Proprietorship', W / 2, 196, { size: 28, align: 'center', color: '#444' });
        text(ctx, `${d.titleNo}   ·   Lot ${d.lotNo}   ·   Mukim ${d.mukim}`, W / 2, 252, { size: 30, font: MONO, align: 'center' });
        // 持有人表
        const x0 = 90;
        const cols = [90, 190, 650, 950, 1150];
        const top = 320;
        box(ctx, x0, top, W - 180, 70 + d.holders.length * 90, 2.5);
        ['Bil.', 'Nama Pemegang', 'No. K/P', 'Bahagian'].forEach((h, i) =>
          text(ctx, h, cols[i] + 14, top + 46, { size: 26, weight: 'bold' }),
        );
        line(ctx, x0, top + 70, W - 90, top + 70, 2.5);
        cols.slice(1, 4).forEach((cx) => line(ctx, cx, top, cx, top + 70 + d.holders.length * 90, 1.5));
        d.holders.forEach((h, i) => {
          const yy = top + 70 + i * 90 + 58;
          text(ctx, String(i + 1), cols[0] + 36, yy, { size: 30, font: MONO });
          text(ctx, h.name, cols[1] + 12, yy, { size: 32, font: MONO, weight: 'bold' });
          text(ctx, h.ic, cols[2] + 12, yy, { size: 30, font: MONO });
          text(ctx, d.holders.length > 1 ? `1/${d.holders.length}` : 'Seluruhnya', cols[3] + 12, yy, { size: 28, font: MONO });
        });
        // 权益记录
        const t2 = top + 70 + d.holders.length * 90 + 90;
        text(ctx, 'REKOD URUSAN', W / 2, t2, { size: 42, weight: 'bold', align: 'center', track: 3 });
        text(ctx, 'Record of Dealings and of Other Matters Affecting Title', W / 2, t2 + 38, { size: 24, align: 'center', color: '#444' });
        const gy = t2 + 70;
        const heads = ['Perkara', 'No. Perserahan', 'Tarikh', 'Catatan'];
        const gx = [90, 380, 690, 900, 1150];
        box(ctx, 90, gy, W - 180, 70 + 8 * 70, 2.5);
        heads.forEach((h, i) => text(ctx, h, gx[i] + 12, gy + 46, { size: 26, weight: 'bold' }));
        line(ctx, 90, gy + 70, W - 90, gy + 70, 2.5);
        for (let i = 1; i <= 8; i++) line(ctx, 90, gy + 70 + i * 70, W - 90, gy + 70 + i * 70, 1);
        gx.slice(1, 4).forEach((cx) => line(ctx, cx, gy, cx, gy + 70 + 8 * 70, 1.5));
        text(ctx, '(Tiada urusan didaftarkan)', 110, gy + 70 + 50, { size: 26, font: MONO, color: '#555' });
        stamp(ctx, 980, gy + 70 + 8 * 70 + 170, 96, ['CONTOH', 'SIMULASI'], 'rgba(150,40,40,0.5)', 0.15);
        watermark(ctx);
      }

      function drawLicence(ctx, d, r) {
        paper(ctx, r);
        box(ctx, 50, 50, W - 100, H - 100, 6);
        box(ctx, 66, 66, W - 132, H - 132, 1.5);
        text(ctx, 'LESEN PEKEBUN KECIL (SH)', W / 2, 190, { size: 62, weight: 'bold', align: 'center', track: 3 });
        text(ctx, 'Small Holder Licence — palm oil (bentuk contoh)', W / 2, 238, { size: 28, align: 'center', color: '#444' });
        // 大号执照号
        box(ctx, 120, 300, W - 240, 170, 3);
        text(ctx, 'No. Lesen / Licence No.', 150, 346, { size: 26, color: '#444' });
        text(ctx, d.licenceNo, W / 2, 438, { size: 84, font: MONO, weight: 'bold', align: 'center', track: 6 });
        let y = 600;
        field(ctx, 'Nama Pemegang', d.holderName, 120, y, W - 240, { labelW: 360, size: 30 });
        y += 86;
        field(ctx, 'No. K/P', d.holderIc, 120, y, W - 240, { labelW: 360 });
        y += 86;
        field(ctx, 'Jenis Lesen', `${d.type}  (Pekebun Kecil)`, 120, y, W - 240, { labelW: 360 });
        y += 86;
        text(ctx, 'Alamat Ladang', 120, y, { size: 26, color: '#333' });
        wrap(ctx, d.premises, 480, y, W - 640, 42, { size: 30, font: MONO, weight: 'bold' });
        line(ctx, 480, y + 10, W - 120, y + 10, 1.5, '#555', [2, 5]);
        y += 150;
        // 有效期：大号、加粗
        box(ctx, 120, y, W - 240, 190, 4);
        text(ctx, 'Sah Sehingga / Valid Until', 150, y + 50, { size: 28, color: '#444' });
        text(ctx, d.validUntil, W / 2, y + 150, { size: 100, font: MONO, weight: 'bold', align: 'center', track: 4 });
        y += 270;
        text(ctx, 'Syarat:', 120, y, { size: 26, weight: 'bold' });
        ['1. Lesen ini tidak boleh dipindah milik.', '2. Hendaklah dipamerkan apabila diminta.', '3. Perbaharui sebelum tarikh tamat.'].forEach((s, i) =>
          text(ctx, s, 150, y + 44 + i * 40, { size: 25, font: MONO, color: '#333' }),
        );
        line(ctx, 780, y + 200, 1120, y + 200, 2);
        text(ctx, 'Pegawai Pengeluar (contoh)', 780, y + 238, { size: 22, color: '#444' });
        stamp(ctx, 330, y + 190, 100, ['CONTOH', 'SIMULASI'], 'rgba(150,40,40,0.5)', -0.25);
        watermark(ctx);
      }

      function drawCert(ctx, d, r) {
        paper(ctx, r);
        // 双层装饰边框
        box(ctx, 44, 44, W - 88, H - 88, 8, '#2a5a3a');
        box(ctx, 66, 66, W - 132, H - 132, 2, '#2a5a3a');
        text(ctx, 'SIJIL PENSIJILAN MSPO', W / 2, 200, { size: 64, weight: 'bold', align: 'center', track: 3, color: '#1f4a30' });
        text(ctx, 'Malaysian Sustainable Palm Oil Certificate (contoh)', W / 2, 250, { size: 30, align: 'center', color: '#444' });
        text(ctx, 'Dengan ini disahkan bahawa', W / 2, 360, { size: 28, align: 'center', color: '#444' });
        text(ctx, d.holder, W / 2, 440, { size: 46, weight: 'bold', align: 'center' });
        text(ctx, 'telah memenuhi keperluan standard di bawah skim pensijilan kumpulan', W / 2, 500, { size: 26, align: 'center', color: '#444' });
        let y = 620;
        const row = (k, v) => {
          field(ctx, k, v, 120, y, W - 240, { labelW: 400, size: 28 });
          y += 82;
        };
        row('No. Sijil / Certificate No.', d.certNo);
        text(ctx, 'Unit Pensijilan', 120, y, { size: 26, color: '#333' });
        const uy = wrap(ctx, d.unit, 520, y, W - 640, 36, { size: 26, font: MONO, weight: 'bold' });
        line(ctx, 520, uy + 10, W - 120, uy + 10, 1.5, '#555', [2, 5]);
        y = uy + 82;
        wrap(ctx, 'Standard: ' + d.standard, 120, y + 8, W - 240, 38, { size: 26, color: '#333' });
        y += 100;
        row('Skop', 'Pekebun kecil (skim kumpulan)');
        row('Tarikh Mula', d.start);
        // 到期日大号
        box(ctx, 120, y + 10, W - 240, 150, 4, '#2a5a3a');
        text(ctx, 'Tarikh Tamat / Expiry Date', 150, y + 58, { size: 26, color: '#444' });
        text(ctx, d.expiry, W / 2, y + 134, { size: 80, font: MONO, weight: 'bold', align: 'center', track: 4 });
        y += 240;
        row('Badan Pensijilan', d.body);
        line(ctx, 130, y + 130, 480, y + 130, 2);
        text(ctx, 'Pengarah (contoh)', 130, y + 168, { size: 22, color: '#444' });
        line(ctx, 760, y + 130, 1110, y + 130, 2);
        text(ctx, 'Juruaudit (contoh)', 760, y + 168, { size: 22, color: '#444' });
        stamp(ctx, 620, y + 70, 92, ['CONTOH', 'SIMULASI'], 'rgba(30,90,60,0.55)', 0.1);
        watermark(ctx);
      }

      const DRAW = { title1: drawTitle1, title2: drawTitle2, licence: drawLicence, cert: drawCert };

      // ---------- 拍照效果：放在桌面上、歪一点、有阴影、光线不均、有噪点、可能模糊 ----------
      const OUT_W = 1200;
      const OUT_H = 1650;
      function photograph(docCanvas, look) {
        const r = rng(look.seed * 101 + 7);
        const PW = 1600;
        const PH = 2200;
        const c = mk(PW, PH);
        const ctx = c.getContext('2d');
        // 桌面
        const g = ctx.createLinearGradient(0, 0, PW, PH);
        g.addColorStop(0, '#6d5c49');
        g.addColorStop(1, '#4b4036');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, PW, PH);
        for (let i = 0; i < 260; i++) {
          ctx.strokeStyle = `rgba(0,0,0,${r() * 0.07})`;
          ctx.lineWidth = r() * 3 + 1;
          const yy = r() * PH;
          ctx.beginPath();
          ctx.moveTo(0, yy);
          ctx.bezierCurveTo(PW * 0.3, yy + r() * 30 - 15, PW * 0.7, yy + r() * 30 - 15, PW, yy + r() * 20 - 10);
          ctx.stroke();
        }
        // 纸（带阴影）
        const s = 1.1;
        ctx.save();
        ctx.translate(PW / 2 + (r() - 0.5) * 30, PH / 2 + (r() - 0.5) * 30);
        ctx.rotate((look.rot * Math.PI) / 180);
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 46;
        ctx.shadowOffsetX = 16;
        ctx.shadowOffsetY = 22;
        if (look.blur) ctx.filter = `blur(${look.blur}px)`;
        ctx.drawImage(docCanvas, (-W * s) / 2, (-H * s) / 2, W * s, H * s);
        ctx.restore();
        ctx.filter = 'none';
        // 光线：一侧亮一侧暗
        const lg = ctx.createLinearGradient(0, 0, PW, PH * 0.4);
        lg.addColorStop(0, 'rgba(255,255,240,0.16)');
        lg.addColorStop(1, 'rgba(0,0,0,0.26)');
        ctx.fillStyle = lg;
        ctx.fillRect(0, 0, PW, PH);
        if (look.shadow) {
          // 手机挡住光线投下的斜向阴影带
          const sg = ctx.createLinearGradient(PW * 0.15, 0, PW * 0.75, PH * 0.55);
          sg.addColorStop(0, 'rgba(0,0,0,0)');
          sg.addColorStop(0.45, 'rgba(0,0,0,0.5)');
          sg.addColorStop(0.62, 'rgba(0,0,0,0.5)');
          sg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = sg;
          ctx.fillRect(0, 0, PW, PH);
        }
        // 暗角
        const vg = ctx.createRadialGradient(PW / 2, PH / 2, PH * 0.35, PW / 2, PH / 2, PH * 0.75);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.45)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, PW, PH);
        // 整体亮度
        if (look.light < 1) {
          ctx.fillStyle = `rgba(0,0,0,${(1 - look.light) * 0.75})`;
          ctx.fillRect(0, 0, PW, PH);
        }
        // 传感器噪点
        const amp = look.noise ?? 9;
        const img = ctx.getImageData(0, 0, PW, PH);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const n = (r() - 0.5) * amp * 2;
          d[i] += n;
          d[i + 1] += n;
          d[i + 2] += n;
        }
        ctx.putImageData(img, 0, 0);
        // 缩到输出尺寸
        const out = mk(OUT_W, OUT_H);
        out.getContext('2d').drawImage(c, 0, 0, OUT_W, OUT_H);
        return out;
      }

      // ---------- 主流程 ----------
      const log = (s) => (document.getElementById('log').textContent += '\n' + s);
      (async () => {
        const samples = await (await fetch('/spec.json')).json();
        document.getElementById('log').textContent = `共 ${samples.length} 张`;
        await document.fonts.ready;
        for (const sm of samples) {
          const doc = mk(W, H);
          DRAW[sm.kind](doc.getContext('2d'), sm.doc, rng(sm.look.seed));
          const photo = photograph(doc, sm.look);
          const blob = await new Promise((res) => photo.toBlob(res, 'image/jpeg', 0.82));
          const resp = await fetch(`/save?name=${encodeURIComponent(sm.name)}`, { method: 'POST', body: blob });
          log(`${sm.name}: ${resp.ok ? '已保存' : '保存失败'} (${Math.round(blob.size / 1024)} KB)`);
          const fig = document.createElement('figure');
          const img = new Image();
          img.src = URL.createObjectURL(blob);
          fig.append(img, Object.assign(document.createElement('figcaption'), { textContent: sm.name }));
          document.getElementById('grid').append(fig);
        }
        log('完成');
        document.title = '完成';
      })().catch((e) => log('出错：' + e));
    </script>
  </body>
</html>
