# PR 检查：跑测试和构建，不部署。在 GitHub 上设为合并前必须通过。
# 各目录还没有代码时自动跳过，骨架阶段也是绿的。
steps:
  - id: api-test
    name: mcr.microsoft.com/dotnet/sdk:8.0
    entrypoint: bash
    args:
      - -c
      - |
        if ls api/*.sln api/*.csproj >/dev/null 2>&1; then cd api && dotnet test; else echo "api: 还没有代码，跳过"; fi
  - id: web-build
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f web/package.json ]; then cd web && npm ci && npx ng build; else echo "web: 还没有代码，跳过"; fi
options:
  logging: CLOUD_LOGGING_ONLY
